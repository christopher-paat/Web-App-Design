<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Básica</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
    <div class="container site-container bg-white border border-2 border-secondary rounded-3 p-0 my-3">
        <header class="header">
            <nav class="navbar px-3 border-bottom border-2 border-secondary">
                <a class="navbar-brand fw-bold" href="index.html">Calculadoras y funciones matemáticas</a>
            </nav>
        </header>

        <main class="main-content-full p-4">
            <div class="card calc-card mx-auto">
                <div class="card-header fw-bold">Calculadora básica</div>
                <div class="card-body">
                    <div class="row mb-3 align-items-center">
                        <label for="num1" class="col-4 col-form-label">Número 1:</label>
                        <div class="col-8">
                            <input type="text" id="num1" class="form-control">
                        </div>
                    </div>
                    <div class="row mb-3 align-items-center">
                        <label for="num2" class="col-4 col-form-label">Número 2:</label>
                        <div class="col-8">
                            <input type="text" id="num2" class="form-control">
                        </div>
                    </div>

                    <div class="calc-buttons d-grid gap-2 my-4">
                        <button type="button" class="btn btn-outline-dark" data-op="suma" title="Suma">+</button>
                        <button type="button" class="btn btn-outline-dark" data-op="resta" title="Resta">-</button>
                        <button type="button" class="btn btn-outline-dark" data-op="raizCuadrada" title="Raíz cuadrada de Número 1">√</button>
                        <button type="button" class="btn btn-outline-dark" data-op="multiplicacion" title="Multiplicación">*</button>
                        <button type="button" class="btn btn-outline-dark" data-op="division" title="División">/</button>
                        <button type="button" class="btn btn-outline-dark" data-op="inversa" title="Inversa de Número 1">1/x</button>
                    </div>

                    <div class="row align-items-center">
                        <label for="resultado" class="col-4 col-form-label fw-bold">Resultado:</label>
                        <div class="col-8">
                            <input type="text" id="resultado" class="form-control bg-light" readonly>
                        </div>
                    </div>
                </div>
                <div class="card-footer text-end">
                    <a href="index.html" class="btn btn-sm btn-secondary">Inicio</a>
                </div>
            </div>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
